---
###############################################################################
# common role - OS prerequisites every Kubernetes node needs.
#
# Why each step:
#   - swap OFF        : kubelet refuses to start with swap on (k8s requirement)
#   - kernel modules  : overlay (container fs) + br_netfilter (pod networking)
#   - sysctl          : let iptables see bridged traffic + enable IP forwarding
###############################################################################

- name: Disable swap right now
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Disable swap permanently (comment it out in /etc/fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load required kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Ensure kernel modules load on every boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Set sysctl params required by Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"

- name: Apply sysctl params without reboot
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
