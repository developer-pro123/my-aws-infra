---
###############################################################################
# containerd role - install + configure the container runtime.
#
# Kubernetes does NOT use Docker directly; it talks to a CRI runtime.
# containerd is the standard choice. The one critical setting is the cgroup
# driver: it must be "systemd" to match kubelet's default, or pods crash-loop.
###############################################################################

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

- name: Ensure /etc/containerd exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Render the default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false

- name: Write containerd config with the systemd cgroup driver
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    # Take the default config and flip SystemdCgroup on.
    content: "{{ containerd_default.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
    mode: "0644"
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
