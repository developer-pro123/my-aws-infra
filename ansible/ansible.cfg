[defaults]
# Inventory is passed at runtime so we can pick the env:
#   ansible-playbook -i inventory/dev.ini playbooks/cluster.yml
# (we have both inventory/dev.ini and inventory/prod.ini, so don't hardcode one)
roles_path        = roles
remote_user       = ubuntu
private_key_file  = ~/.ssh/crm_dev_ed25519
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
